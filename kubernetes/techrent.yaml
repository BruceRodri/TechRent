apiVersion: v1
kind: Namespace
metadata:
  name: techrent-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: techrent-config
  namespace: techrent-lab
type: Opaque
stringData:
  POSTGRES_PASSWORD: lab_techrent_only
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=TechRentDB;Username=postgres;Password=lab_techrent_only
  Authentication__Google__ClientId: audit-local-fake-id
  Authentication__Google__ClientSecret: audit-local-fake-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: techrent-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-keys
  namespace: techrent-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: techrent-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - {name: POSTGRES_DB, value: TechRentDB}
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: techrent-config, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, TechRentDB]}
            initialDelaySeconds: 4
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: techrent-lab}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: techrent-init, namespace: techrent-lab}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: esperar-postgres
          image: postgres:18
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres -d TechRentDB; do sleep 2; done"]
      containers:
        - name: init
          image: techrent-distribuido:final
          imagePullPolicy: Never
          envFrom: [{secretRef: {name: techrent-config}}]
          env:
            - {name: Initialization__Enabled, value: "true"}
            - {name: Initialization__ExitAfter, value: "true"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: techrent, namespace: techrent-lab}
spec:
  replicas: 2
  selector:
    matchLabels: {app: techrent}
  template:
    metadata:
      labels: {app: techrent}
    spec:
      initContainers:
        - name: esperar-inicializacion
          image: postgres:18
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: techrent-config, key: POSTGRES_PASSWORD}}
          command:
            - sh
            - -c
            - >-
              until [ "$(psql -h postgres -U postgres -d TechRentDB -tAc
              'SELECT COUNT(*) FROM "AspNetUsers" WHERE "NormalizedEmail" = '\''ADMIN@TECHRENT.COM'\''' 2>/dev/null)" = "1" ];
              do sleep 2; done
      containers:
        - name: techrent
          image: techrent-distribuido:final
          imagePullPolicy: Never
          envFrom: [{secretRef: {name: techrent-config}}]
          env:
            - {name: ASPNETCORE_ENVIRONMENT, value: Production}
            - {name: Initialization__Enabled, value: "false"}
            - {name: DataProtection__KeyDirectory, value: /keys}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: [{name: keys, mountPath: /keys}]
      volumes: [{name: keys, persistentVolumeClaim: {claimName: app-keys}}]
---
apiVersion: v1
kind: Service
metadata: {name: techrent, namespace: techrent-lab}
spec:
  selector: {app: techrent}
  ports: [{port: 80, targetPort: 8080}]
