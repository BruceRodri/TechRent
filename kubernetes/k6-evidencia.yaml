apiVersion: batch/v1
kind: Job
metadata: {name: k6-evidencia, namespace: techrent-lab}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: Never
          args: ["run", "/scripts/k6-resiliencia.js"]
          volumeMounts: [{name: scripts, mountPath: /scripts}]
      volumes: [{name: scripts, configMap: {name: k6-scripts}}]
